[project]
name = "fe-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pandas~=2.2.3",
    "numpy~=1.26.4",
    "statsmodels~=0.14.0",
    "openpyxl~=3.1.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
